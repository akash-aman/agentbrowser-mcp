<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo frame</title>
<style>
:root { --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #c9d1d9; --dim: #8b949e; --bright: #e6edf3; --tool: #7ee787; --arg: #a5d6ff; --hot: #ffa657; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1000px; height: 600px; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", sans-serif; }
.stage { display: grid; grid-template-columns: 552px 1fr; gap: 14px; height: 600px; padding: 14px; }
.left { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.browser { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.titlebar { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; background: #21262d; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; }
.url { flex: 1; height: 20px; padding: 0 10px; overflow: hidden; border-radius: 10px; background: var(--bg); color: var(--dim); font-size: 11.5px; line-height: 20px; white-space: nowrap; text-overflow: ellipsis; }
.viewport { position: relative; width: 550px; height: 413px; background: #d0d7de; }
.viewport img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.badge { position: absolute; top: 10px; right: 10px; padding: 3px 9px; border-radius: 6px; background: rgba(13, 17, 23, .85); color: #fff; font-size: 12px; }
.caption { flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--bright); font-size: 15.5px; line-height: 1.4; }
.right { display: flex; flex-direction: column; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.head { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
.head b { color: var(--bright); font-weight: 600; }
.task, .finding { margin: 10px 12px 0; padding: 8px 10px; border-radius: 8px; color: var(--bright); font-size: 13px; }
.task { border: 1px solid #1f6feb88; background: #1f6feb22; }
.finding { margin-bottom: 12px; border: 1px solid #2ea04388; background: #2ea04322; }
.task b, .finding b { display: block; color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.log { display: flex; flex: 1; flex-direction: column; justify-content: flex-end; gap: 9px; min-height: 0; overflow: hidden; padding: 8px 12px 10px; }
.step { font: 11.5px/1.45 "SF Mono", Menlo, monospace; }
.tool { color: var(--tool); font-weight: 700; }
.args { color: var(--arg); }
.result { margin-top: 3px; padding-left: 9px; border-left: 2px solid var(--line); white-space: pre-wrap; word-break: break-word; }
.result .hot { color: var(--hot); }
.result.running { color: var(--dim); }
</style>
</head>
<body>
<div class="stage">
  <div class="left">
    <div class="browser">
      <div class="titlebar">
        <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
        <div class="url" id="url"></div>
      </div>
      <div class="viewport"><img id="frame" alt=""><div class="badge" id="badge" hidden></div></div>
    </div>
    <div class="caption" id="caption"></div>
  </div>
  <div class="right">
    <div class="head"><b>agent-browser-mcp</b> · tool calls and the results the model reads</div>
    <div class="task" id="task"></div>
    <div class="log" id="log"></div>
    <div class="finding" id="finding" hidden></div>
  </div>
</div>
<script>
// render(state) draws one frame; demo/main.go calls it for every frame and
// screenshots the result.
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
// Lines the server adds on its own, which the demos are about.
const HOT = /^(Page problems|- JS error|- \d{3} |Paused|Note:|Top functions|Unused)/;

window.render = async (s) => {
  $("url").textContent = s.url || "about:blank";
  $("caption").textContent = s.caption || "";
  $("task").replaceChildren(el("b", "", "Task"), s.task);
  const badge = $("badge");
  badge.hidden = !s.badge;
  badge.textContent = s.badge || "";
  const log = $("log");
  log.replaceChildren();
  for (const st of s.steps) {
    const d = el("div", "step");
    const call = el("div");
    call.append(el("span", "tool", st.tool), " ", el("span", "args", st.args));
    d.append(call);
    if (st.result == null) {
      d.append(el("div", "result running", st.running));
    } else {
      const r = el("div", "result");
      for (const line of st.result.split("\n")) r.append(el("div", HOT.test(line) ? "hot" : "", line || " "));
      d.append(r);
    }
    log.append(d);
  }
  const f = $("finding");
  f.hidden = !s.finding;
  f.replaceChildren(el("b", "", "Finding"), s.finding || "");
  const img = $("frame");
  if (img.getAttribute("src") !== s.frame) {
    img.src = s.frame;
    await img.decode().catch(() => {});
  }
};
</script>
</body>
</html>
